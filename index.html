<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaker Red — Videos</title>
<meta name="description" content="Videos made by Chaker Redjil (Chaker Red): ads, promos and motion design.">
<meta property="og:title" content="Chaker Red — Videos">
<meta property="og:description" content="Ads, promos and motion design by Chaker Redjil.">
<meta property="og:image" content="thumbs/duo-chocolate.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&text=%E6%AD%A6&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="hero-assets/bg-run.jpg">
<link rel="stylesheet" href="hero-assets/deal-hero.css?v=4">
<script>
  // the reel ring's entrance owns the first seconds, unless motion is reduced or the link points at one video
  if (!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) && (location.hash.length < 2 || location.hash === "#top")) {
    document.documentElement.classList.add("deal-entering");
    // if the hero's script never arrives, give the page back
    setTimeout(function () { if (!document.querySelector(".dh")) document.documentElement.classList.remove("deal-entering"); }, 8000);
  }
</script>
<style>
  :root {
    --bg: #0d0b10; --panel: #17141c; --line: #2a2531; --text: #f4f0f7; --muted: #a39cab;
    --accent: #ffcc4d; --accent2: #c86bff;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* top bar: the wordmark the loader's brand word lands on, and the contact buttons */
  .topbar { position: fixed; z-index: 30; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px clamp(16px, 4vw, 40px); }
  .topbar::before { content: ""; position: absolute; inset: 0 0 -24px; z-index: -1; pointer-events: none; transition: opacity .3s;
    background: linear-gradient(rgba(13,11,16,.86), rgba(13,11,16,0)); }
  .wordmark { font-weight: 700; font-size: 19px; line-height: 1; letter-spacing: -.02em; color: var(--text); text-decoration: none; white-space: nowrap; }
  .tb-right { display: flex; align-items: center; gap: 10px; }
  .tb-link { font-size: 14px; color: var(--muted); text-decoration: none; padding: 8px 6px; }
  .tb-link:hover { color: var(--text); }
  .topbar .contact { flex-wrap: nowrap; }
  .topbar .btn { padding: 9px 14px; font-size: 14px; }
  .topbar.solid::before { inset: 0; background: rgba(13,11,16,.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  #videos, #contact-box { scroll-margin-top: 80px; }
  #deal:empty { height: 0; }
  /* only the hero is shown: the video grid, the contact box and the footer stay in the page (shared #video links still open) but are hidden */
  main#videos, .cta, footer { display: none; }
  .nick { margin: 0 0 6px; font-size: 14px; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0; font-size: clamp(44px, 9vw, 96px); line-height: .95; letter-spacing: -.03em; }
  .lead { margin: 14px 0 0; color: var(--muted); font-size: 18px; }
  .contact { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 999px; text-decoration: none;
    font-weight: 500; border: 1px solid var(--line); background: var(--panel); transition: transform .2s, border-color .2s; }
  .btn:hover { transform: translateY(-2px); border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #1a1406; border-color: var(--accent); }
  .btn svg { width: 18px; height: 18px; }

  .bar { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0 20px; color: var(--muted); }
  .bar h2 { margin: 0; color: var(--text); font-size: 22px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
  .filter { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; transition: border-color .2s, color .2s; }
  .filter:hover { border-color: var(--accent2); color: var(--text); }
  .filter.on { background: var(--accent); border-color: var(--accent); color: #1a1406; }
  .filter .n { opacity: .7; }
  .shape { display: inline-block; border: 1.5px solid currentColor; border-radius: 3px; }
  .shape.v { width: 9px; height: 15px; } .shape.h { width: 16px; height: 9px; }
  .gtitle { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 15px; font-weight: 500; color: var(--muted); }
  .gtitle b { color: var(--text); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; padding-bottom: 56px; }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .grid.wide .thumb { aspect-ratio: 16 / 9; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
    opacity: 0; transform: translateY(18px); animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .card.hit { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,204,77,.25); }
  .thumb { position: relative; display: block; width: 100%; aspect-ratio: 9 / 16; background: #000; border: 0; padding: 0; cursor: pointer; overflow: hidden; }
  .thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
  .thumb video { opacity: 0; transition: opacity .3s; }
  .card:hover .thumb img { transform: scale(1.04); }
  .card.previewing .thumb video { opacity: 1; }
  .play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: rgba(13,11,16,.55); backdrop-filter: blur(6px); display: grid; place-items: center; transition: transform .25s; }
  .card:hover .play { transform: scale(1.1); }
  .play svg { width: 24px; height: 24px; margin-left: 3px; fill: var(--text); }
  .dur { position: absolute; right: 10px; bottom: 10px; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.6); }
  .meta { padding: 14px 16px 16px; }
  .meta h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.3; }
  .meta p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .meta p:has(+ .note) { margin-bottom: 2px; }
  .meta .note { font-size: 11px; opacity: .75; }
  .links { display: flex; gap: 8px; }
  .chip { flex: 1; text-align: center; font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text); text-decoration: none; }
  .chip:hover { border-color: var(--accent2); }
  .like { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; font-weight: 500; padding: 8px 12px;
    border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
  .like svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; transition: transform .2s; }
  .like:hover { border-color: #ff5d8f; }
  .like.on { color: #ff5d8f; border-color: rgba(255,93,143,.5); }
  .like.on svg { fill: currentColor; }
  .like.pop svg { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }

  .player { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(5,4,7,.92); padding: 16px; }
  .player.open { display: flex; }
  .player video { max-height: calc(100vh - 110px); max-width: 100%; aspect-ratio: 9 / 16; border-radius: 16px; background: #000; }
  .player video.wide { aspect-ratio: 16 / 9; width: min(1280px, calc(100vw - 32px), calc((100vh - 110px) * 16 / 9)); }
  .player .inner { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .player .ptitle { font-weight: 500; text-align: center; }
  .close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 22px; cursor: pointer; }

  .cta { padding: 8px 0 56px; }
  .cta-box { position: relative; overflow: hidden; text-align: center; padding: 48px 24px; border-radius: 28px;
    border: 1px solid var(--line); background: radial-gradient(60% 80% at 50% 0%, rgba(200,107,255,.18), transparent 70%), var(--panel); }
  .cta-box h2 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.02em; }
  .cta-box .lead { margin: 10px auto 28px; }
  .cta-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .cta-link { display: flex; align-items: center; gap: 14px; min-width: 260px; padding: 14px 20px 14px 14px; border-radius: 18px;
    text-decoration: none; text-align: left; border: 1px solid var(--line); background: var(--bg); transition: transform .2s, border-color .2s; }
  .cta-link:hover { transform: translateY(-3px); border-color: var(--accent); }
  .cta-link .ic { width: 44px; height: 44px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--accent); color: #1a1406; }
  .cta-link.wa .ic { background: #25d366; color: #fff; }
  .cta-link.wa:hover { border-color: #25d366; }
  .cta-link svg { width: 22px; height: 22px; }
  .cta-link b { display: block; font-size: 16px; }
  .cta-link small { display: block; color: var(--muted); font-size: 13px; word-break: break-all; }
  footer { border-top: 1px solid var(--line); padding: 22px 0 32px; color: var(--muted); font-size: 13px; }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--accent); }
  button, a { -webkit-tap-highlight-color: transparent; }

  /* phones: two columns of cards, compact text, full-width contact */
  @media (max-width: 640px) {
    .lead { font-size: 16px; }
    .topbar .contact { width: auto; }
    .topbar .btn { padding: 9px; }
    .topbar .btn .t, .tb-link { display: none; }
    .grid { grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 40px; }
    .grid.wide { grid-template-columns: 1fr; }
    .filter { font-size: 13px; padding: 7px 12px; }
    .card { border-radius: 16px; }
    .play { width: 46px; height: 46px; margin: -23px 0 0 -23px; }
    .play svg { width: 18px; height: 18px; }
    .meta { padding: 10px 10px 12px; }
    .meta h3 { font-size: 14px; }
    .meta p { font-size: 12px; margin-bottom: 8px; }
    .links { flex-wrap: wrap; gap: 6px; }
    .like { flex: 1 0 100%; justify-content: center; }
    .chip { font-size: 12px; padding: 7px 4px; }
    .cta-box { padding: 36px 16px; border-radius: 22px; }
    .cta-link { min-width: 0; width: 100%; }
    .player { padding: 8px; }
    .player video { max-height: calc(100vh - 90px); }
    .player video.wide { width: 100%; }
  }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; transition: .3s;
    background: var(--accent); color: #1a1406; padding: 10px 16px; border-radius: 10px; font-weight: 500; z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body>
<nav class="topbar" aria-label="Site">
  <a class="wordmark" href="#top" data-wordmark>Chaker Red</a>
  <div class="tb-right"><div class="contact" id="contact"></div></div>
</nav>

<!-- the hero: a ring of the videos below, drawn by hero-assets/deal-hero.js (source in hero/) -->
<div id="deal"></div>

<main class="wrap" id="videos">
  <div class="bar"><h2>Videos</h2><span id="count"></span></div>
  <div class="filters" id="filters" role="group" aria-label="Filter by format"></div>
  <div id="groups"></div>
</main>

<section class="cta">
  <div class="wrap">
    <div class="cta-box" id="contact-box">
      <p class="nick">Contact</p>
      <h2>Let's make your next video</h2>
      <p class="lead">Ads, promos and motion design. Send me a message.</p>
      <div class="cta-links" id="cta-links"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap"><span>© <span id="year"></span> Chaker Redjil · Chaker Red</span><a href="#top">Back to top ↑</a></div>
</footer>

<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Video player">
  <button class="close" id="close" aria-label="Close">×</button>
  <div class="inner">
    <video id="pv" controls playsinline preload="metadata"></video>
    <div class="ptitle" id="ptitle"></div>
  </div>
</div>
<div class="toast" id="toast">Link copied</div>

<script src="videos.js?v=6"></script>
<script>
  const V = window.VIDEOS, CT = window.CONTACT || {};
  const $ = (id) => document.getElementById(id);
  const ICON = {
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>',
    heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.3-9.2C1.5 7.6 3.6 4.5 6.9 4.5c2 0 3.6 1.1 5.1 3 1.5-1.9 3.1-3 5.1-3 3.3 0 5.4 3.1 4.2 6.3C19.5 15.4 12 20 12 20Z" stroke-linejoin="round"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
  };

  // contact
  const links = [];
  if (CT.email) links.push(`<a class="btn primary" href="mailto:${CT.email}" aria-label="Email ${CT.email}">${ICON.mail}<span class="t">Email</span></a>`);
  if (CT.whatsapp) links.push(`<a class="btn" href="https://wa.me/${CT.whatsapp}" target="_blank" rel="noopener" aria-label="WhatsApp">${ICON.wa}<span class="t">WhatsApp</span></a>`);
  $("contact").innerHTML = links.join("");
  const big = [];
  if (CT.email) big.push(`<a class="cta-link" href="mailto:${CT.email}"><span class="ic">${ICON.mail}</span><span><b>Email</b><small>${CT.email}</small></span></a>`);
  if (CT.whatsapp) big.push(`<a class="cta-link wa" href="https://wa.me/${CT.whatsapp}" target="_blank" rel="noopener"><span class="ic">${ICON.wa}</span><span><b>WhatsApp</b><small>+${CT.whatsapp.replace(/^(\d{3})(\d{3})(\d{2})(\d{2})(\d{2})$/, "$1 $2 $3 $4 $5")}</small></span></a>`);
  $("cta-links").innerHTML = big.join("");
  $("year").textContent = new Date().getFullYear();

  // formats: vertical (9:16, the default) and horizontal (16:9), each in its own section
  const FORMATS = { "9:16": { name: "Vertical", shape: "v", cls: "" }, "16:9": { name: "Horizontal", shape: "h", cls: "wide" } };
  const ratioOf = (v) => (FORMATS[v.ratio] ? v.ratio : "9:16");
  const used = [...new Set(V.map(ratioOf))]; // in order of the newest video of each format
  const plural = (n) => `${n} video${n === 1 ? "" : "s"}`;

  // cards
  const linkTo = (v) => `${location.origin}${location.pathname}#${v.id}`;
  const card = (v, i) => `
    <article class="card" id="${v.id}" style="animation-delay:${i * 80}ms">
      <button class="thumb" data-i="${i}" aria-label="Play ${v.title}">
        <img src="${v.thumb}" alt="" loading="lazy">
        <video muted loop playsinline preload="none" data-src="${v.file}"></video>
        <span class="play">${ICON.play}</span>
        <span class="dur">${v.duration || ""}</span>
      </button>
      <div class="meta">
        <h3>${v.title}</h3>
        <p>${v.tag || ""}</p>
        ${v.socialLikes ? '<p class="note">♥ includes likes on social media</p>' : ""}
        <div class="links">
          <button class="like" data-like="${i}" aria-label="Like ${v.title}" title="${v.socialLikes ? "Includes likes on social media" : ""}">${ICON.heart}<span class="n">…</span></button>
          <button class="chip" data-copy="${i}">Copy link</button>
          <a class="chip" href="${v.file}" target="_blank" rel="noopener">Open file</a>
        </div>
      </div>
    </article>`;
  $("groups").innerHTML = used.map((r) => {
    const f = FORMATS[r], items = V.map((v, i) => [v, i]).filter(([v]) => ratioOf(v) === r);
    const title = used.length > 1 ? `<h3 class="gtitle"><span class="shape ${f.shape}"></span><b>${f.name}</b> ${r} · ${plural(items.length)}</h3>` : "";
    return `<section class="group" data-ratio="${r}">${title}<div class="grid ${f.cls}">${items.map(([v, i]) => card(v, i)).join("")}</div></section>`;
  }).join("");

  // filter by format (only shown when there is more than one)
  let current = "all";
  const setFilter = (r) => {
    current = r;
    document.querySelectorAll(".group").forEach((g) => (g.hidden = r !== "all" && g.dataset.ratio !== r));
    document.querySelectorAll(".filter").forEach((b) => b.classList.toggle("on", b.dataset.ratio === r));
    $("count").textContent = plural(r === "all" ? V.length : V.filter((v) => ratioOf(v) === r).length);
  };
  if (used.length > 1) {
    $("filters").innerHTML = [`<button class="filter" data-ratio="all">All <span class="n">${V.length}</span></button>`]
      .concat(used.map((r) => `<button class="filter" data-ratio="${r}"><span class="shape ${FORMATS[r].shape}"></span>${FORMATS[r].name} ${r} <span class="n">${V.filter((v) => ratioOf(v) === r).length}</span></button>`))
      .join("");
    $("filters").addEventListener("click", (e) => { const b = e.target.closest(".filter"); if (b) setFilter(b.dataset.ratio); });
  } else $("filters").remove();
  setFilter("all");

  // likes: one shared counter per video (free counter service, same for every visitor); one like per browser
  const API = "https://abacus.jasoncameron.dev", NS = "chaker-red-portf";
  const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : String(n);
  const liked = (id) => { try { return localStorage.getItem("liked:" + id) === "1"; } catch { return false; } };
  // shown = real likes from social media (videos.js) + likes on this site
  const setCount = (i, n) => document.querySelectorAll(`[data-like="${i}"] .n`).forEach((el) => (el.textContent = fmt((V[i].socialLikes || 0) + n)));
  V.forEach((v, i) => {
    if (liked(v.id)) document.querySelector(`[data-like="${i}"]`).classList.add("on");
    fetch(`${API}/get/${NS}/${v.id}`).then((r) => (r.ok ? r.json() : { value: 0 })).then((d) => setCount(i, Math.max(0, d.value || 0)))
      .catch(() => setCount(i, 0));
  });
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-like]"); if (!b) return;
    const v = V[+b.dataset.like];
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    if (liked(v.id)) return;
    try { localStorage.setItem("liked:" + v.id, "1"); } catch {}
    b.classList.add("on");
    fetch(`${API}/hit/${NS}/${v.id}`).then((r) => r.json()).then((d) => setCount(+b.dataset.like, d.value)).catch(() => {});
  });

  // hover preview (desktop)
  document.querySelectorAll(".card").forEach((card) => {
    const vid = card.querySelector("video");
    card.addEventListener("mouseenter", () => {
      if (!matchMedia("(hover: hover)").matches) return;
      if (!vid.src) vid.src = vid.dataset.src;
      vid.play().then(() => card.classList.add("previewing")).catch(() => {});
    });
    card.addEventListener("mouseleave", () => { vid.pause(); card.classList.remove("previewing"); });
  });

  // player
  const P = $("player"), PV = $("pv");
  const open = (i, push = true, at = 0) => {
    const v = V[i];
    PV.src = v.file + (at > 0 ? `#t=${at}` : ""); PV.poster = v.thumb; $("ptitle").textContent = v.title;
    PV.classList.toggle("wide", ratioOf(v) === "16:9");
    P.classList.add("open"); document.body.style.overflow = "hidden";
    PV.play().catch(() => {});
    if (push) history.replaceState(null, "", "#" + v.id);
  };
  const close = () => {
    PV.pause(); PV.removeAttribute("src"); PV.load();
    P.classList.remove("open"); document.body.style.overflow = "";
  };
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-i]"); if (t) open(+t.dataset.i);
    const c = e.target.closest("[data-copy]");
    if (c) {
      navigator.clipboard.writeText(linkTo(V[+c.dataset.copy])).then(() => {
        $("toast").classList.add("show"); setTimeout(() => $("toast").classList.remove("show"), 1400);
      });
    }
  });
  // the top bar turns solid once the hero is behind it
  const bar = document.querySelector(".topbar"), deal = $("deal");
  const barState = () => bar.classList.toggle("solid", deal.getBoundingClientRect().bottom < 90);
  addEventListener("scroll", barState, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(barState).observe(deal); else barState();

  // the hero's cards open a video at the scene they show
  window.openVideo = (id, at = 0) => { const i = V.findIndex((v) => v.id === id); if (i >= 0) open(i, true, at); };
  $("close").onclick = close;
  P.addEventListener("click", (e) => { if (e.target === P) close(); });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && P.classList.contains("open")) close(); });

  // a shared link (#video-id) opens that video
  const fromHash = () => {
    const i = V.findIndex((v) => "#" + v.id === location.hash);
    if (i < 0) return;
    if (current !== "all" && ratioOf(V[i]) !== current) setFilter("all");
    const card = $(V[i].id); card.scrollIntoView({ block: "center" }); card.classList.add("hit");
    open(i, false);
  };
  fromHash();
  addEventListener("hashchange", fromHash);
</script>
